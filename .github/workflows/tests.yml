name: Python tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ${{ vars.TEST_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python on GitHub-hosted runner
        if: ${{ vars.TEST_RUNNER != 'joseph-nfl-mac' }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            requirements-data.txt

      - name: Select GitHub-hosted Python
        if: ${{ vars.TEST_RUNNER != 'joseph-nfl-mac' }}
        shell: bash
        run: |
          echo "PYTHON_BIN=$(command -v python)" >> "$GITHUB_ENV"
          python --version

      - name: Select Homebrew Python on self-hosted Mac
        if: ${{ vars.TEST_RUNNER == 'joseph-nfl-mac' }}
        shell: bash
        run: |
          PYTHON_BIN="$(
            brew --prefix "python@${{ matrix.python-version }}"
          )/bin/python${{ matrix.python-version }}"

          test -x "$PYTHON_BIN"
          echo "PYTHON_BIN=$PYTHON_BIN" >> "$GITHUB_ENV"
          "$PYTHON_BIN" --version

      - name: Upgrade packaging tools
        run: |
          "$PYTHON_BIN" -m pip install \
            --upgrade pip setuptools wheel

      - name: Install project and test dependencies
        run: |
          "$PYTHON_BIN" -m pip install -e ".[data,dev]"

      - name: Verify installed dependencies
        run: |
          "$PYTHON_BIN" -m pip check

      - name: Compile source
        run: |
          "$PYTHON_BIN" -m compileall -q src examples

      - name: Run tests
        run: |
          "$PYTHON_BIN" -m pytest -q -W error::FutureWarning
