name: Python tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-311:
    name: Python 3.11
    runs-on:
      - self-hosted
      - macOS
      - ARM64
      - joseph-nfl-mac
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Create Python 3.11 environment
        shell: bash
        run: |
          SYSTEM_PYTHON="$(brew --prefix python@3.11)/bin/python3.11"
          test -x "$SYSTEM_PYTHON"

          VENV_DIR="$RUNNER_TEMP/nfl-python-311"
          rm -rf "$VENV_DIR"

          "$SYSTEM_PYTHON" -m venv "$VENV_DIR"

          echo "PYTHON_BIN=$VENV_DIR/bin/python" >> "$GITHUB_ENV"
          "$VENV_DIR/bin/python" --version

      - name: Upgrade packaging tools
        shell: bash
        run: |
          "$PYTHON_BIN" -m pip install \
            --upgrade pip setuptools wheel

      - name: Install project and test dependencies
        shell: bash
        run: |
          "$PYTHON_BIN" -m pip install -e ".[data,dev]"

      - name: Verify installed dependencies
        shell: bash
        run: |
          "$PYTHON_BIN" -m pip check

      - name: Compile source
        shell: bash
        run: |
          "$PYTHON_BIN" -m compileall -q src examples

      - name: Core live-feature parity/leakage tests (must not skip)
        shell: bash
        run: |
          "$PYTHON_BIN" -m pytest -q -W error::FutureWarning \
            tests/test_live_features_ci.py | tee core_ci_result.txt
          if grep -Eqi "skipped|no tests ran" core_ci_result.txt; then
            echo "CORE LIVE-FEATURE PARITY/LEAKAGE TESTS SKIPPED — FAILING"
            exit 1
          fi
          grep -Eq "26 passed" core_ci_result.txt
          echo "core live-feature parity/leakage tests: PASS"
          echo "skipped: 0"

      - name: Run tests
        shell: bash
        run: |
          "$PYTHON_BIN" -m pytest -q -W error::FutureWarning

  python-314:
    name: Python 3.14
    runs-on:
      - self-hosted
      - macOS
      - ARM64
      - joseph-nfl-mac
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Create Python 3.14 environment
        shell: bash
        run: |
          SYSTEM_PYTHON="$(brew --prefix python@3.14)/bin/python3.14"
          test -x "$SYSTEM_PYTHON"

          VENV_DIR="$RUNNER_TEMP/nfl-python-314"
          rm -rf "$VENV_DIR"

          "$SYSTEM_PYTHON" -m venv "$VENV_DIR"

          echo "PYTHON_BIN=$VENV_DIR/bin/python" >> "$GITHUB_ENV"
          "$VENV_DIR/bin/python" --version

      - name: Upgrade packaging tools
        shell: bash
        run: |
          "$PYTHON_BIN" -m pip install \
            --upgrade pip setuptools wheel

      - name: Install project and test dependencies
        shell: bash
        run: |
          "$PYTHON_BIN" -m pip install -e ".[data,dev]"

      - name: Verify installed dependencies
        shell: bash
        run: |
          "$PYTHON_BIN" -m pip check

      - name: Compile source
        shell: bash
        run: |
          "$PYTHON_BIN" -m compileall -q src examples

      - name: Core live-feature parity/leakage tests (must not skip)
        shell: bash
        run: |
          "$PYTHON_BIN" -m pytest -q -W error::FutureWarning \
            tests/test_live_features_ci.py | tee core_ci_result.txt
          if grep -Eqi "skipped|no tests ran" core_ci_result.txt; then
            echo "CORE LIVE-FEATURE PARITY/LEAKAGE TESTS SKIPPED — FAILING"
            exit 1
          fi
          grep -Eq "26 passed" core_ci_result.txt
          echo "core live-feature parity/leakage tests: PASS"
          echo "skipped: 0"

      - name: Run tests
        shell: bash
        run: |
          "$PYTHON_BIN" -m pytest -q -W error::FutureWarning
