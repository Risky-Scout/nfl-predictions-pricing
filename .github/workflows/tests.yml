name: Python tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-311:
    name: Python 3.11
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Assert GitHub-hosted Linux runner
        shell: bash
        run: |
          echo "RUNNER_OS=$RUNNER_OS"
          echo "RUNNER_ENVIRONMENT=$RUNNER_ENVIRONMENT"
          if [ "$RUNNER_OS" != "Linux" ]; then
            echo "Expected RUNNER_OS=Linux, got '$RUNNER_OS' — FAILING"
            exit 1
          fi
          if [ "$RUNNER_ENVIRONMENT" != "github-hosted" ]; then
            echo "Expected RUNNER_ENVIRONMENT=github-hosted, got '$RUNNER_ENVIRONMENT' — FAILING"
            exit 1
          fi
          echo "runner assertion: GitHub-hosted Linux confirmed"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Record Python interpreter
        shell: bash
        run: |
          echo "PYTHON_BIN=$(which python)" >> "$GITHUB_ENV"
          python --version

      - name: Upgrade packaging tools
        shell: bash
        run: |
          "$PYTHON_BIN" -m pip install \
            --upgrade pip setuptools wheel

      - name: Install project and test dependencies
        shell: bash
        run: |
          "$PYTHON_BIN" -m pip install -e ".[data,dev]"

      - name: Verify installed dependencies
        shell: bash
        run: |
          "$PYTHON_BIN" -m pip check

      - name: Compile source
        shell: bash
        run: |
          "$PYTHON_BIN" -m compileall -q src examples

      - name: Core live-feature parity/leakage tests (must not skip)
        shell: bash
        run: |
          "$PYTHON_BIN" -m pytest -q -W error::FutureWarning \
            tests/test_live_features_ci.py | tee core_ci_result.txt
          if grep -Eqi "skipped|no tests ran" core_ci_result.txt; then
            echo "CORE LIVE-FEATURE PARITY/LEAKAGE TESTS SKIPPED — FAILING"
            exit 1
          fi
          grep -Eq "26 passed" core_ci_result.txt
          echo "core live-feature parity/leakage tests: PASS"
          echo "skipped: 0"

      - name: Run tests
        shell: bash
        run: |
          "$PYTHON_BIN" -m pytest -q -W error::FutureWarning

  python-314:
    name: Python 3.14
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Assert GitHub-hosted Linux runner
        shell: bash
        run: |
          echo "RUNNER_OS=$RUNNER_OS"
          echo "RUNNER_ENVIRONMENT=$RUNNER_ENVIRONMENT"
          if [ "$RUNNER_OS" != "Linux" ]; then
            echo "Expected RUNNER_OS=Linux, got '$RUNNER_OS' — FAILING"
            exit 1
          fi
          if [ "$RUNNER_ENVIRONMENT" != "github-hosted" ]; then
            echo "Expected RUNNER_ENVIRONMENT=github-hosted, got '$RUNNER_ENVIRONMENT' — FAILING"
            exit 1
          fi
          echo "runner assertion: GitHub-hosted Linux confirmed"

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          allow-prereleases: true

      - name: Record Python interpreter
        shell: bash
        run: |
          echo "PYTHON_BIN=$(which python)" >> "$GITHUB_ENV"
          python --version

      - name: Upgrade packaging tools
        shell: bash
        run: |
          "$PYTHON_BIN" -m pip install \
            --upgrade pip setuptools wheel

      - name: Install project and test dependencies
        shell: bash
        run: |
          "$PYTHON_BIN" -m pip install -e ".[data,dev]"

      - name: Verify installed dependencies
        shell: bash
        run: |
          "$PYTHON_BIN" -m pip check

      - name: Compile source
        shell: bash
        run: |
          "$PYTHON_BIN" -m compileall -q src examples

      - name: Core live-feature parity/leakage tests (must not skip)
        shell: bash
        run: |
          "$PYTHON_BIN" -m pytest -q -W error::FutureWarning \
            tests/test_live_features_ci.py | tee core_ci_result.txt
          if grep -Eqi "skipped|no tests ran" core_ci_result.txt; then
            echo "CORE LIVE-FEATURE PARITY/LEAKAGE TESTS SKIPPED — FAILING"
            exit 1
          fi
          grep -Eq "26 passed" core_ci_result.txt
          echo "core live-feature parity/leakage tests: PASS"
          echo "skipped: 0"

      - name: Run tests
        shell: bash
        run: |
          "$PYTHON_BIN" -m pytest -q -W error::FutureWarning
