# Fix 2 -- machine-readable pregame-state dictionary.
#
# One entry per state FAMILY (not per individual engineered column -- each
# family emits many columns from one lag/rolling rule; documenting the rule
# once per family is the unit that matters for leakage review). Generated by
# hand from the authoritative interface in
# src/nfl_hybrid/features/pregame_state.py; keep in sync with that module.
#
# Field meanings:
#   state_name                       Family key used in PregameStateBundle.state
#   football_meaning                 What the numbers represent
#   source                           Upstream data this family is derived from
#   source_module / source_function  Where the builder lives
#   lookback                         Window / snapshot rule
#   lag_rule                         Exactly how "no current-or-future info" is enforced
#   missingness_behavior             What a team with no eligible prior games gets
#   historical_live_reproducibility  Whether historical replay and live scoring
#                                    are guaranteed to agree, and any known gap
#   contributing_scope               team_direct (enumerable per-row lineage) or
#                                     leaguewide_prior_to_snapshot (regression
#                                     pools every team's history before the cut)
#   reused_from                      Existing files this family's math comes from
#   new_in_fix_2                     Files newly added by Fix 2 for this family
#   production_wired                 Whether this family is consumed by the
#                                     live prediction pipeline (predict_week /
#                                     fundamental_shadow) as of Fix 2

state_families:

  - state_name: epa
    football_meaning: >
      Per-team offense/defense-allowed EPA, success rate, and situational
      splits (early/late down, red zone, two-minute, etc.), rolling and
      season-to-date.
    source: nflverse play-by-play (backfill.pbp)
    source_module: nfl_hybrid.features.pregame_rolling
    source_function: build_team_pregame_features
    lookback: "last-4-game window and season/all-time expanding mean + EWM(halflife=4 games)"
    lag_rule: >
      Each team-game metric is shift(1)'d (excludes the current row) before
      any expanding/rolling/EWM aggregation; enforced in code, verified in
      tests/test_pregame_rolling.py and features/augmented_matrix.leakage_report.
    missingness_behavior: "NaN / zero count for a team's chronologically first game."
    historical_live_reproducibility: >
      Guaranteed equal for historical replay vs. live scoring at the same
      as_of, given the same finality determination -- see
      features/augmented_matrix.resolve_finality_before_asof and
      build_live_augmented_features.
    contributing_scope: team_direct
    reused_from: [src/nfl_hybrid/features/pbp_advanced.py, src/nfl_hybrid/features/pregame_rolling.py]
    new_in_fix_2: []
    production_wired: true  # via features/augmented_matrix.py -> pricing/predict_week.py

  - state_name: opponent_adjusted
    football_meaning: >
      Ridge-regression opponent-adjusted offense/defense ratings (EPA, success
      rate, explosiveness, points/drive, etc.) with partial pooling toward a
      league prior.
    source: nflverse play-by-play (backfill.pbp), via the same team-game table as `epa`
    source_module: nfl_hybrid.features.opponent_pregame
    source_function: build_opponent_adjusted_team_features
    lookback: "all games with event_time strictly before the target's day-floor snapshot, up to 3 seasons back, season-decayed"
    lag_rule: >
      A per-day snapshot ridge fit uses only rows with snapshot_date < the
      target's snapshot_date; the target's own day is always excluded, not
      merely shifted -- enforced in code (_fit_metric_snapshot / the
      work.groupby("snapshot_date") loop) and tests/test_opponent_pregame.py.
    missingness_behavior: "Falls back to the league prior mean/sd for a team with zero eligible history."
    historical_live_reproducibility: >
      Not yet wired into build_live_augmented_features's finality/availability
      gate -- see "remaining duplicate/bypass paths" in the Fix 2 report. Using
      this family live would need the same finality resolution the epa family
      already has.
    contributing_scope: leaguewide_prior_to_snapshot
    reused_from: [src/nfl_hybrid/features/opponent_pregame.py]
    new_in_fix_2: []
    production_wired: false  # correct and independently tested, but no production caller before Fix 2

  - state_name: qb
    football_meaning: >
      Starter-probability-weighted quarterback priors (EPA/dropback, success
      rate, completion rate, CPOE, sack/INT rate, etc.), regressed toward
      team and league priors by recency-weighted dropback exposure.
    source: nflverse play-by-play, aggregated to one row per passer per game
    source_module: nfl_hybrid.features.qb_pregame
    source_function: build_qb_pregame_team_features
    lookback: "recency-weighted up to max_dropbacks=1000, up to 3 seasons back, season-decayed"
    lag_rule: >
      Same day-floor snapshot_date < target rule as opponent_adjusted, applied
      to the per-QB dropback history; enforced in code and
      tests/test_qb_pregame.py.
    missingness_behavior: "Falls back to the league prior mean/sd for a QB or team with zero eligible history."
    historical_live_reproducibility: >
      Same gap as opponent_adjusted -- not yet wired into the live
      finality/availability gate.
    contributing_scope: leaguewide_prior_to_snapshot
    reused_from: [src/nfl_hybrid/features/qb_pregame.py, src/nfl_hybrid/priors/quarterback.py]
    new_in_fix_2: []
    production_wired: false

  - state_name: elo
    football_meaning: >
      Pregame Elo rating, implied win probability, and expected home margin
      per team, with home-field/travel/rest/QB adjustments and season
      regression-to-mean.
    source: canonical games table (score, kickoff, neutral_site, playoff)
    source_module: nfl_hybrid.features.elo_state
    source_function: build_elo_pregame_state
    lookback: "full career-to-date rating (sequential state machine, no fixed window)"
    lag_rule: >
      LegacyElo.predict() is called and its result is the emitted row BEFORE
      LegacyElo.update() is called with that same game's score; an unplayed
      (score-null) game predicts but never updates. Enforced in code and
      tests/test_elo_pregame_state.py.
    missingness_behavior: "Initial rating (1500) for a team's first-ever game."
    historical_live_reproducibility: >
      New in Fix 2; not yet wired into any live-scoring path, so no historical
      replay vs. live comparison exists yet (recorded as a gap, not fabricated).
    contributing_scope: team_direct
    reused_from: [src/nfl_hybrid/legacy/elo.py, src/nfl_hybrid/data/team_ids.py]
    new_in_fix_2: [src/nfl_hybrid/features/elo_state.py]
    production_wired: false

  - state_name: market_history
    football_meaning: >
      Each team's rolling ATS-cover rate and over/under (total) rate from its
      own prior games -- distinct from the CURRENT game's own market line
      (home_spread / total_line), which augmented_matrix.py already attaches
      as a pregame feature. No family built a *history* of ATS/OU results
      before Fix 2.
    source: canonical games table (score + home_spread_reference/total_line_reference)
    source_module: nfl_hybrid.features.market_history
    source_function: build_market_history_pregame_state
    lookback: "last-4-game window and season/all-time expanding mean + EWM(halflife=4 games), identical to the epa family"
    lag_rule: >
      Reuses build_team_pregame_features's shift(1)-before-rolling primitive
      unmodified via an explicit metric_columns=[market_ats_win,
      market_over_win] call -- no new rolling math. Enforced in code and
      tests/test_market_history_state.py.
    missingness_behavior: >
      NaN / zero count for a team's chronologically first game. A push (edge
      exactly zero) is pd.NA (excluded), never scored as a loss, via
      nfl_hybrid.labels.edge_to_nullable_binary -- the repository's single
      tie/push policy.
    historical_live_reproducibility: >
      New in Fix 2; not yet wired into any live-scoring path (same gap as elo).
    contributing_scope: team_direct
    reused_from: [src/nfl_hybrid/features/pregame_rolling.py, src/nfl_hybrid/labels.py, src/nfl_hybrid/data/team_ids.py]
    new_in_fix_2: [src/nfl_hybrid/features/market_history.py]
    production_wired: false

lineage_and_invariants:
  module: src/nfl_hybrid/features/state_lineage.py
  description: >
    Generic, family-agnostic lineage primitives shared by every family above:
    sequential_prior_game_lineage (team_direct scope) and
    snapshot_prior_game_lineage (leaguewide_prior_to_snapshot scope, id list
    capped at lineage_id_cap=250 per row with contributing_ids_truncated set
    rather than silently dropped). verify_pregame_state_lineage checks, for
    every family: no self-reference, no unknown game_id, and no contributing
    game at or after the target's own kickoff.

orchestrator:
  module: src/nfl_hybrid/features/pregame_state.py
  function: build_authoritative_pregame_state
  description: >
    Calls every family builder above unchanged, attaches lineage, and runs
    nfl_hybrid.features.feature_manifest.validate_no_banned_features against
    every family's non-identifier columns before returning -- a target/outcome
    column entering any family's state raises here rather than reaching a
    caller. Does not select a production feature set, train, tune, or
    recalibrate anything; does not change which family(ies)
    pricing/predict_week.py already consumes.
