[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nfl-hybrid-model"
version = "0.3.0"
description = "Auditable NFL Moneyline, ATS, totals, and in-play modeling framework reconstructed from the supplied workbooks."
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "joblib>=1.4",
  "PyYAML>=6.0"
]

[project.optional-dependencies]
data = [
  "nflreadpy>=0.1.1",
  "polars>=1.0",
  "pyarrow>=15",
  "requests>=2.32",
  "lxml>=5.0",
  "beautifulsoup4>=4.12"
]
dev = ["pytest>=8.0"]

[project.scripts]
nfl-hybrid-backfill = "nfl_hybrid.data.cli:main"
nfl-hybrid-priors = "nfl_hybrid.priors.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
