scope: closing_reference_pregame_baselines
development_seasons: [2021, 2022, 2023]
architecture_confirmation_season: 2024
untouched_final_test_season: 2025

baseline_families:
  elo:
    scale: 400
    points_per_elo: 25
    home_field_elo: 55
    travel_elo_per_1000: -4
    rest_elo: 25
    k_factor: 20
    playoff_multiplier: 1.2
    offseason_regression_fraction: 0.3333333333333333
  quarterback:
    starter_adjustment_multiplier: 3.3
    new_game_weight: 0.10
  total_points:
    base_weight: 0.70
    head_to_head_weight: 0.30
    wind_intercept: 45.973
    wind_slope_per_mph: -0.3787
  market_calibration:
    scoring_rule: brier
    contest_points_base: 25
    contest_points_brier_multiplier: 100
    decay_half_life_observations: 360

rules:
  parity_reference_cells_are_immutable: true
  spreadsheet_baselines_are_challengers_not_assumed_winners: true
  current_python_models_must_beat_applicable_spreadsheet_baseline: true
  2024_and_2025_development_use_prohibited: true
